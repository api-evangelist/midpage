description: >-
  FinOps view of Midpage spend. Midpage bills per-seat subscriptions (Law
  Students & Faculty at $25/mo and Professional at $99/mo, plus AI costs for
  Drafting mode) and custom Enterprise agreements. Standalone developer
  products - the REST case-law API, MCP server, and SQL read replica - are
  arranged through the developer portal; their per-request unit economics are
  not publicly documented and are marked unreconciled here.
notes: >-
  Subscription seat prices are from the public pricing page; developer API /
  MCP / SQL usage rates are not publicly published. Verify metered developer
  pricing against the Midpage developer portal during reconciliation.
sources:
- https://www.midpage.ai/pricing
- https://www.midpage.ai/data
- https://app.midpage.ai/developers
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Midpage
serviceCategory: Legal Technology
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Midpage
  ServiceCategory: Legal Technology
  ProviderName: Midpage
  PublisherName: Midpage
  InvoiceIssuerName: Midpage
  BillingCurrency: USD
