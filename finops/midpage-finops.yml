meters:
- name: subscription_seats
  description: Per-seat monthly subscriptions (Law Students & Faculty, Professional).
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: drafting_ai_costs
  description: AI costs incurred by Drafting mode, billed separately from the seat price.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - user
- name: api_requests
  description: REST case-law API calls (search, opinions/get, me) billed via the developer portal.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api_key
  - endpoint
- name: mcp_requests
  description: MCP server tool invocations by connected AI assistants.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - tool
- name: sql_queries
  description: Queries executed against the SQL read replica.
  unit: queries
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track seats, Drafting AI costs, and developer API/MCP/SQL usage through the Midpage developer portal and usage dashboard.
- name: Allocation
  description: Tag API keys and seats per team/matter; map spend to internal cost centers.
- name: Optimization
  description: Right-size seat counts; scope search page_size and bulk reads to need; use caching of retrieved opinions to reduce repeat calls.
- name: Accountability
  description: Assign owners per project/key; review subscription and usage spend monthly against budget.
maintainers:
